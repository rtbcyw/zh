<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的国标英雄 · 紫幻生日纪念</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css?v=19">
</head>
<body class="paper">
<main class="paper-page">
	<a class="back-link" href="index.html">← BACK TO LOCKER</a>
	<header class="paper-head">
		<div class="en">03 / NATIONAL BADGES</div>
		<h1>我的国标英雄</h1>
		<p class="badges-milestone">国服最强中路 · 143段 · <span id="litCount">0</span>/24 已点亮</p>
	</header>

	<section id="starField" class="star-field"></section>
</main>

<script src="js/data.js?v=7"></script>
<script>
/* ---------- 24颗星星错落坐标（百分比，避免重叠） ---------- */
const positions = [
	{ x: 8,  y: 10 }, { x: 30, y: 6  }, { x: 52, y: 12 }, { x: 74, y: 5  }, { x: 92, y: 14 },
	{ x: 18, y: 26 }, { x: 40, y: 22 }, { x: 62, y: 28 }, { x: 84, y: 24 },
	{ x: 8,  y: 40 }, { x: 34, y: 44 }, { x: 58, y: 38 }, { x: 82, y: 46 },
	{ x: 20, y: 56 }, { x: 46, y: 52 }, { x: 70, y: 60 }, { x: 92, y: 54 },
	{ x: 12, y: 70 }, { x: 36, y: 74 }, { x: 60, y: 68 }, { x: 84, y: 76 },
	{ x: 26, y: 88 }, { x: 50, y: 84 }, { x: 74, y: 90 }
];

const heroes = SITE.national.heroes;
const field = document.getElementById("starField");
const litCountEl = document.getElementById("litCount");
let litCount = 0;

// SVG 五角星
function starSVG(favorite, lit) {
	const color = favorite ? "#f5b301" : (lit ? "#ffd93d" : "#cfd8e3");
	const glow = favorite ? "#ffcf33" : (lit ? "#ffe066" : "none");
	return `<svg viewBox="0 0 24 24" width="100%" height="100%">
		<path d="M12 2l2.9 6.26L21.5 9.27l-4.75 4.63 1.12 6.53L12 17.27 6.13 20.43l1.12-6.53L2.5 9.27l6.6-1.01z"
			fill="${color}" stroke="${glow}" stroke-width="0.5"/>
	</svg>`;
}

heroes.forEach((h, i) => {
	const pos = positions[i] || { x: Math.random()*80+10, y: Math.random()*80+10 };
	const size = h.favorite ? 44 : 28 + (i % 3) * 8; // 本命更大
	const star = document.createElement("button");
	star.className = "star" + (h.favorite ? " favorite" : "");
	star.style.left = pos.x + "%";
	star.style.top = pos.y + "%";
	star.style.width = size + "px";
	star.style.height = size + "px";
	star.style.setProperty("--twinkle", (2 + (i % 4) * 0.6) + "s");
	star.innerHTML = starSVG(h.favorite, false) +
		`<span class="star-name">${h.name}</span>`;
	star.addEventListener("click", () => {
		star.classList.toggle("lit");
		const isLit = star.classList.contains("lit");
		star.querySelector("svg").outerHTML = starSVG(h.favorite, isLit);
		if (isLit) litCount++; else litCount = Math.max(0, litCount - 1);
		litCountEl.textContent = litCount;
	});
	field.appendChild(star);
});
</script>
</body>
</html>
