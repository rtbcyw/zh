<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>直播唱的歌 · 紫幻生日纪念</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css?v=27">
</head>
<body class="paper">
<main class="paper-page">
	<a class="back-link" href="index.html">← BACK TO LOCKER</a>
	<header class="paper-head">
		<div class="en">SONGS / 直播时候唱的歌</div>
		<h1>小歌单</h1>
	</header>

	<!-- 播放器：唱片 / 标题 / 进度条 / 控制 -->
	<section class="player" id="player">
		<div class="player-disc">♪</div>
		<div class="player-main">
			<div class="player-title" id="trackTitle">—</div>
			<div class="player-sub">LIVE SINGING · 直播翻唱</div>
			<div class="player-bar" id="progressBar">
				<div class="player-bar-fill" id="barFill"></div>
				<div class="player-bar-knob" id="barKnob"></div>
			</div>
			<div class="player-bottom">
				<div class="player-controls">
					<button id="btnPrev" title="上一首">⏮</button>
					<button id="btnPlay" title="播放 / 暂停">▶</button>
					<button id="btnNext" title="下一首">⏭</button>
				</div>
				<div class="player-time" id="timeText">0:00 / 0:00</div>
			</div>
		</div>
	</section>

	<!-- 歌曲列表 -->
	<ol class="song-list" id="songList"></ol>
</main>

<audio id="audio" preload="metadata"></audio>

<script src="js/data.js?v=8"></script>
<script>
(function () {
	"use strict";
	const songs = SITE.songs;
	const audio = document.getElementById("audio");
	const player = document.getElementById("player");
	const titleEl = document.getElementById("trackTitle");
	const timeText = document.getElementById("timeText");
	const bar = document.getElementById("progressBar");
	const fill = document.getElementById("barFill");
	const knob = document.getElementById("barKnob");
	const btnPlay = document.getElementById("btnPlay");
	const btnPrev = document.getElementById("btnPrev");
	const btnNext = document.getElementById("btnNext");
	const listEl = document.getElementById("songList");

	let idx = 0;

	/* ---------- 渲染列表 ---------- */
	listEl.innerHTML = songs.map((s, i) =>
		`<li class="song-item" data-i="${i}">
			<span class="no">${String(i + 1).padStart(2, "0")}</span>
			<span class="name">${s.title}</span>
			<span class="tag">♪ 播放中</span>
			<span class="dur" data-dur="${i}">--:--</span>
		</li>`).join("");
	const items = [...listEl.querySelectorAll(".song-item")];
	items.forEach(el => el.addEventListener("click", () => play(+el.dataset.i, true)));

	/* ---------- 拿每首歌时长（加载元数据即可，不播放） ---------- */
	songs.forEach((s, i) => {
		const probe = new Audio();
		probe.preload = "metadata";
		probe.src = `assets/audio/${s.file}`;
		probe.addEventListener("loadedmetadata", () => {
			const el = listEl.querySelector(`[data-dur="${i}"]`);
			if (el) el.textContent = fmt(probe.duration);
		});
	});

	function fmt(sec) {
		if (!isFinite(sec)) return "--:--";
		const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
		return `${m}:${String(s).padStart(2, "0")}`;
	}

	/* ---------- 播放控制 ---------- */
	function play(i, autoplay) {
		idx = (i + songs.length) % songs.length;
		audio.src = `assets/audio/${songs[idx].file}`;
		titleEl.textContent = songs[idx].title;
		items.forEach((el, n) => el.classList.toggle("current", n === idx));
		if (autoplay) {
			audio.play().catch(() => {});
		} else {
			updatePlayBtn();
		}
	}

	function updatePlayBtn() {
		btnPlay.textContent = audio.paused ? "▶" : "⏸";
		player.classList.toggle("playing", !audio.paused);
	}

	btnPlay.addEventListener("click", () => {
		if (!audio.src) play(0, true);
		else if (audio.paused) audio.play().catch(() => {});
		else audio.pause();
	});
	btnPrev.addEventListener("click", () => play(idx - 1, true));
	btnNext.addEventListener("click", () => play(idx + 1, true));

	audio.addEventListener("play", updatePlayBtn);
	audio.addEventListener("pause", updatePlayBtn);
	audio.addEventListener("ended", () => play(idx + 1, true));   // 播完自动切下一首
	audio.addEventListener("timeupdate", () => {
		const p = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
		fill.style.width = p + "%";
		knob.style.left = p + "%";
		timeText.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
	});

	/* ---------- 进度条：点击 / 拖拽跳转 ---------- */
	let seeking = false;
	function seekTo(clientX) {
		const rect = bar.getBoundingClientRect();
		const p = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
		if (audio.duration) {
			audio.currentTime = p * audio.duration;
			fill.style.width = p * 100 + "%";
			knob.style.left = p * 100 + "%";
		}
	}
	bar.addEventListener("pointerdown", e => {
		seeking = true;
		bar.setPointerCapture(e.pointerId);
		seekTo(e.clientX);
	});
	bar.addEventListener("pointermove", e => { if (seeking) seekTo(e.clientX); });
	bar.addEventListener("pointerup", () => { seeking = false; });

	/* ---------- 初始：载入第一首信息，不自动播放 ---------- */
	play(0, false);
})();
</script>
</body>
</html>
