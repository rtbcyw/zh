<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>决赛地图 · 紫幻生日纪念</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<style>
/* ============================================================
   决赛地图 · 手账航线风（本页专用样式）
   ============================================================ */

/* 锁定 body 不滚动，改由 .fm-page 内部容器滚动 —— 避免浏览器因 layout shift 自动滑页 */
html, body.paper { overflow: hidden; }
.fm-page {
	max-width: 1080px; margin: 0 auto;
	height: 100vh; height: 100dvh;
	padding: 28px 18px 24px;
	overflow-y: auto;
	overscroll-behavior: contain;
	scroll-behavior: auto; /* 禁用平滑滚动，杜绝任何自动滑动 */
}

/* —— 顶部统计条 —— */
.fm-stats {
	display: flex; flex-wrap: wrap; gap: 10px;
	margin: 18px 0 6px;
}
.fm-chip {
	background: var(--paper-bg-2);
	border: 1.5px solid var(--line);
	border-radius: var(--r-pill);
	padding: 7px 16px;
	font-size: 14px; color: var(--ink-soft);
	box-shadow: 0 3px 0 rgba(43,52,64,.05);
}
.fm-chip b { color: var(--accent-e); font-size: 16px; margin: 0 3px; }
.fm-chip .ic { margin-right: 5px; }

/* —— 地图舞台（地图固定，详情卡移到下方独立展开，不再挤压地图） —— */
.fm-stage {
	position: relative;
	margin-top: 14px;
	background: linear-gradient(180deg, #eef5fc, #e3eef9);
	border: 2px solid #cdddee;
	border-radius: 22px;
	box-shadow: var(--shadow-card);
	overflow: hidden;
}
.fm-map-wrap { position: relative; }
.fm-map {
	display: block; width: 100%; height: auto;
	overflow: hidden;
	clip-path: inset(0);          /* 强制裁剪 SVG 溢出内容，杜绝飞行元素触发 scrollIntoView */
	transform: translateZ(0);      /* 强制 GPU 合成层，隔离 layout */
}

/* 海面波浪纹理 */
.sea-wave { fill: none; stroke: rgba(255,255,255,.7); stroke-width: 2; stroke-linecap: round; }
.land {
	fill: #fbf4e4;
	stroke: #e0cfa9;
	stroke-width: 2.5;
	stroke-linejoin: round;
}
.map-grid { stroke: rgba(120,150,175,.10); stroke-width: 1; }

/* 航线 */
.route {
	fill: none;
	stroke: var(--accent-e);
	stroke-width: 2.6;
	stroke-linecap: round;
	stroke-dasharray: 2 11;
	animation: routeFlow 1.1s linear infinite;
	opacity: .85;
}
@keyframes routeFlow { to { stroke-dashoffset: -26; } }
.route-dir { fill: var(--accent-e); opacity: .8; }

/* 橘子图钉 */
.city-marker { cursor: pointer; }
.city-marker .pin-pulse {
	fill: rgba(232,128,63,.18);
	stroke: rgba(232,128,63,.55);
	stroke-width: 1.5;
	transform-box: fill-box; transform-origin: center;
	animation: pinPulse 2.2s ease-out infinite;
}
@keyframes pinPulse {
	0%   { transform: scale(.7); opacity: .9; }
	70%  { transform: scale(1.9); opacity: 0; }
	100% { transform: scale(1.9); opacity: 0; }
}
.city-marker .pin-orange {
	font-size: 31px; text-anchor: middle;
	filter: drop-shadow(0 3px 3px rgba(150,90,30,.35));
	transition: transform .25s cubic-bezier(.34,1.56,.64,1);
	transform-box: fill-box; transform-origin: center;
}
.city-marker .pin-halo {
	fill: rgba(255,255,255,.75);
	stroke: var(--accent-e);
	stroke-width: 2;
	opacity: 0;
	transition: opacity .2s;
}
.city-marker:hover .pin-halo, .city-marker.active .pin-halo { opacity: 1; }
.city-marker:hover .pin-orange, .city-marker.active .pin-orange { transform: scale(1.28) rotate(-8deg); }
.city-marker.champion .pin-orange { filter: drop-shadow(0 0 8px rgba(240,180,60,.9)) drop-shadow(0 3px 3px rgba(150,90,30,.35)); }
.city-label {
	font-size: 17px; font-weight: 800; fill: var(--ink);
	paint-order: stroke;
	stroke: #eef5fc; stroke-width: 5px; stroke-linejoin: round;
	font-family: var(--font-round);
}
.city-en {
	font-size: 9.5px; letter-spacing: 1.5px; fill: var(--ink-faint);
	font-family: Georgia, serif;
}
.times-badge {
	font-size: 10px; font-weight: 800; fill: #fff;
	font-family: var(--font-round);
}
.times-badge-bg { fill: var(--accent-b); }
.fly-orange { font-size: 22px; filter: drop-shadow(0 2px 2px rgba(60,90,120,.25)); }

/* 图例 */
.fm-legend {
	position: absolute; left: 14px; top: 12px;
	display: flex; gap: 14px;
	background: rgba(255,255,255,.82);
	border: 1px solid var(--line);
	border-radius: var(--r-pill);
	padding: 6px 14px;
	font-size: 12px; color: var(--ink-soft);
	backdrop-filter: blur(4px);
}
.fm-legend span { display: inline-flex; align-items: center; gap: 5px; }
.fm-hint {
	position: absolute; right: 14px; bottom: 12px;
	font-size: 12px; color: var(--ink-faint);
	background: rgba(255,255,255,.82);
	border-radius: var(--r-pill); padding: 6px 14px;
	border: 1px solid var(--line);
}

/* —— 城市详情卡（地图下方独立展开，不挤压地图；无动画避免浏览器隐式 scrollIntoView） —— */
.fm-card {
	position: relative;
	max-height: 0;
	opacity: 0;
	overflow: hidden;
	background: rgba(255,255,255,.96);
	border-top: 0 solid #efd9b8;
	box-shadow: none;
	padding: 0 20px;
	margin-top: 0;
}
.fm-card.show {
	max-height: none;
	opacity: 1;
	padding: 18px 20px 16px;
	border-top-width: 2px;
	margin-top: 14px;
	box-shadow: 0 -6px 22px rgba(70,95,120,.08);
}
.fm-card-close {
	position: absolute; top: 10px; right: 12px;
	border: none; background: none; font-size: 22px; line-height: 1;
	color: var(--ink-faint); cursor: pointer; padding: 2px 6px;
}
.fm-card-close:hover { color: var(--ink); }
.fm-city-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.fm-city-name { font-size: 26px; font-weight: 900; color: var(--ink); }
.fm-city-en { font-size: 11px; letter-spacing: 2px; color: var(--accent-e); font-family: Georgia, serif; }
.fm-city-count { font-size: 12px; color: var(--ink-faint); margin-bottom: 12px; }

.fm-event {
	border-left: 3px solid var(--line);
	padding: 2px 0 14px 13px;
	margin-left: 4px;
	position: relative;
}
.fm-event:last-child { padding-bottom: 2px; }
.fm-event::before {
	content: "🍊"; position: absolute; left: -13px; top: 0;
	font-size: 15px; background: #fff; line-height: 18px;
}
.fm-event.champion { border-left-color: var(--accent-e); }
.fm-event-date { font-size: 12px; color: var(--accent-e); font-weight: 800; }
.fm-event-title { font-size: 15px; font-weight: 800; color: var(--ink); margin: 2px 0; }
.fm-event-meta { font-size: 12.5px; color: var(--ink-soft); line-height: 1.7; }
.fm-event-tags { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.fm-tag {
	font-size: 11px; font-weight: 700;
	border-radius: var(--r-pill); padding: 2px 10px;
}
.fm-tag.champion { background: linear-gradient(135deg,#f6b944,#e8803f); color: #fff; }
.fm-tag.runner { background: #e6ebf1; color: #5b6773; }
.fm-tag.team { background: #efe8f7; color: #6b4fa3; border: 1px solid #d8c8ed; }
.fm-event-note {
	font-size: 13px; color: var(--ink-soft); line-height: 1.75;
	background: #fdf7ec; border-radius: 10px; padding: 8px 11px; margin-top: 4px;
}
.fm-event.champion .fm-event-note { background: #fff4e0; }
.fm-event-fans {
	font-size: 12.5px; color: var(--ink-soft); line-height: 1.6;
	background: #f0f5fb; border-left: 3px solid var(--accent-b);
	border-radius: 8px; padding: 6px 11px; margin-top: 6px;
}
.fm-event-fans b { color: var(--accent-e); font-size: 14px; }

/* 点亮按钮 */
.fm-lit-btn {
	display: block; width: 100%; margin-top: 14px;
	padding: 12px 16px; border-radius: var(--r-pill);
	border: 2px dashed var(--accent-e); background: #fff;
	color: var(--accent-e); font-size: 14px; font-weight: 800;
	cursor: pointer; transition: background .2s, color .2s, border-color .2s;
	font-family: var(--font-round);
}
.fm-lit-btn:hover { background: #fff4e0; }
.fm-lit-btn.lit {
	background: linear-gradient(135deg, #f6b944, var(--accent-e));
	color: #fff; border-style: solid; border-color: var(--accent-e);
	box-shadow: 0 4px 12px rgba(232,128,63,.3);
}

/* 点亮后图钉：金色光环 + 星星标记 */
.city-marker.lit .pin-halo {
	fill: rgba(246,185,68,.35); stroke: #f6b944; stroke-width: 2.5;
	opacity: 1; animation: litGlow 2.4s ease-in-out infinite;
}
@keyframes litGlow {
	0%, 100% { opacity: .7; }
	50%      { opacity: 1; }
}
.city-marker.lit .pin-orange { filter: drop-shadow(0 0 6px rgba(246,185,68,.7)) drop-shadow(0 3px 3px rgba(150,90,30,.35)); }

/* 未选城市时的提示便签（地图下方独立引导，不浮在地图上以免压住城市标签） */
.fm-tip {
	display: inline-block;
	margin: 10px 0 0;
	background: rgba(255,255,255,.9);
	border: 1.5px dashed var(--accent-e);
	border-radius: 14px; padding: 8px 16px;
	font-size: 13px; color: var(--ink-soft);
	transition: opacity .3s;
}

/* —— 时间轴 —— */
.fm-track-wrap { margin-top: 22px; }
.fm-track-title {
	font-size: 13px; letter-spacing: 3px; color: var(--ink-faint);
	text-align: center; margin-bottom: 12px;
}
.fm-track {
	display: flex; gap: 0;
	overflow-x: auto;
	padding: 6px 4px 14px;
}
.t-stop {
	flex: 0 0 auto;
	width: 132px;
	text-align: center;
	cursor: pointer;
	position: relative;
	padding-top: 26px;
}
/* 连接线 */
.t-stop::before {
	content: ""; position: absolute; top: 9px; left: 50%;
	width: 100%; height: 2.5px;
	background: repeating-linear-gradient(90deg, var(--accent-e) 0 5px, transparent 5px 11px);
	opacity: .55;
}
.t-stop:last-child::before { display: none; }
.t-dot {
	position: absolute; top: 0; left: 50%; transform: translateX(-50%);
	width: 20px; height: 20px; border-radius: 50%;
	background: #fff;
	border: 3px solid #b9c6d3;
	font-size: 10px; line-height: 15px; text-align: center;
	z-index: 1;
	transition: transform .2s, border-color .2s, box-shadow .2s;
}
.t-stop.runner .t-dot { border-color: #9fb0c2; }
.t-stop.champion .t-dot {
	border-color: var(--accent-e);
	background: var(--accent-e);
	box-shadow: 0 0 0 4px rgba(232,128,63,.18);
}
.t-stop:hover .t-dot, .t-stop.active .t-dot { transform: translateX(-50%) scale(1.25); }
.t-date { font-size: 11px; color: var(--accent-e); font-weight: 800; }
.t-city { font-size: 14px; font-weight: 800; color: var(--ink); margin: 2px 0; }
.t-name {
	font-size: 11px; color: var(--ink-soft); line-height: 1.4;
	display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.t-stop.active .t-city { color: var(--accent-e); }

/* —— 手机端 —— */
@media (max-width: 720px) {
	.fm-tip { display: none; }
	.fm-legend { font-size: 10.5px; padding: 5px 10px; gap: 8px; }
	.fm-hint { display: none; }
	.city-label { font-size: 15px; }
	.t-stop { width: 116px; }
	.fm-card { padding: 0 16px; }
	.fm-card.show { padding: 16px 16px 14px; max-height: 900px; }
}
@media (prefers-reduced-motion: reduce) {
	.route, .city-marker .pin-pulse { animation: none; }
}
</style>
</head>
<body class="paper">
<main class="paper-page fm-page">
	<a class="back-link" href="index.html">← BACK TO LOCKER</a>
	<header class="paper-head">
		<div class="en">FINALS MAP / 五座决赛城市</div>
		<h1>决赛地图</h1>
		<p id="fmSubtitle"></p>
	</header>

	<div class="fm-stats" id="fmStats"></div>

	<div class="fm-stage">
	 <div class="fm-map-wrap">
		<svg class="fm-map" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet" role="img" aria-label="决赛城市手绘地图">
			<!-- 点阵网格（手账纸感） -->
			<g class="map-grid" id="mapGrid"></g>

			<!-- 风格化陆地轮廓：环渤海 → 山东半岛 → 长三角 → 闽粤海岸 → 北部湾（手绘风，非精确地图） -->
			<path class="land" d="
				M0,0 L892,0 L892,104
				Q866,116 880,150
				Q856,176 822,196
				Q790,216 752,242
				Q798,272 850,318
				Q876,334 886,344
				Q906,360 910,384
				Q882,416 840,442
				Q800,472 760,499
				Q724,524 690,548
				Q650,566 610,583
				Q540,600 462,608
				Q360,626 250,646
				Q208,644 176,640
				Q120,648 86,668
				L0,690 Z"/>
			<!-- 海南岛 -->
			<path class="land" d="M250,688 q12,26 -24,42 q-42,12 -60,-8 q-16,-22 10,-40 q36,-18 74,6z"/>
			<!-- 台湾岛 -->
			<path class="land" d="M892,526 q14,26 -2,54 q-14,26 -34,30 q-12,-4 -8,-26 q8,-34 26,-54 q10,-10 18,-4z"/>

			<!-- 海面小波浪 -->
			<path class="sea-wave" d="M905,120 q10,-8 20,0 t20,0 t20,0"/>
			<path class="sea-wave" d="M905,250 q10,-8 20,0 t20,0 t20,0"/>
			<path class="sea-wave" d="M60,700 q10,-8 20,0 t20,0 t20,0"/>
			<path class="sea-wave" d="M420,690 q10,-8 20,0 t20,0 t20,0"/>

			<!-- 航线（JS 渲染） -->
			<g id="routeLayer"></g>
			<!-- 飞行轨迹（隐藏，JS 动态挂动画；小飞机沿航线循环） -->
			<path id="flyPath" fill="none" stroke="none" d=""/>
			<text class="fly-orange" id="flyOrange" text-anchor="middle">✈️</text>
			<!-- 城市图钉（JS 渲染） -->
			<g id="markerLayer"></g>
		</svg>

			<div class="fm-legend">
				<span>🏆 夺冠</span>
				<span>🥈 亚军</span>
				<span>🍊 决赛城市</span>
			</div>
			<div class="fm-hint">点击橘子查看详情</div>
		 </div>
		</div>

		<div class="fm-tip" id="fmTip">🍊 点一点地图上的橘子，看看那一站的故事 →</div>

		<aside class="fm-card" id="fmCard"></aside>

		<div class="fm-track-wrap">
		<div class="fm-track-title">— 决赛时间轴 · TIMELINE —</div>
		<div class="fm-track" id="fmTrack"></div>
	</div>
</main>

<script src="js/data.js?v=10"></script>
<script src="js/map.js?v=8"></script>
</body>
</html>
