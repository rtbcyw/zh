<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紫幻生日纪念</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css?v=30">
</head>
<body>

<!-- ================= 顶部四个文字导航（文案在 data.js 改） ================= -->
<nav class="topnav" id="topnav"></nav>

<!-- ================= 储物柜场景 ================= -->
<main class="scene">
	<div class="camera">
		<div class="locker" id="locker">

			<!-- ============ ①号门（关闭）：拍立得照片墙 → 合照相册 ============ -->
			<section class="bay bay-1">
				<div class="door door-closed">
					<div class="vent vent-top"></div>
					<div class="photo-wall" data-door="1">
					<button class="pw pw-1 obj hotspot" data-action="lightbox" data-img="assets/images/1fd8a5da27396ff04a1842e15fb5b0d6.jpg" title="点击查看大图"><img src="assets/images/1fd8a5da27396ff04a1842e15fb5b0d6.jpg" alt="合照"></button>
					<button class="pw pw-2 obj hotspot" data-action="lightbox" data-img="assets/images/366b0a420e2abfcbb0c758351d88df30.jpg" title="点击查看大图"><img src="assets/images/366b0a420e2abfcbb0c758351d88df30.jpg" alt="合照"></button>
					<button class="pw pw-3 obj hotspot" data-action="lightbox" data-img="assets/images/5343cd07a6e0dd7969ed048a809f9f29.jpg" title="点击查看大图"><img src="assets/images/5343cd07a6e0dd7969ed048a809f9f29.jpg" alt="合照"></button>
					<button class="pw pw-4 obj hotspot" data-action="lightbox" data-img="assets/images/31ea00c5b2a89d5dbba92cf5f0ee29c7.jpg" title="点击查看大图"><img src="assets/images/31ea00c5b2a89d5dbba92cf5f0ee29c7.jpg" alt="合照"></button>
					<!-- DIY 趣味小贴纸（可拖动装饰，也可拖到④号门） -->
					<span class="diy-sticker"      style="top:10%;left:24%;--rot:-12deg">🌙</span>
					<span class="diy-sticker st-lg" style="top:7%;left:68%;--rot:8deg">🍊</span>
					<span class="diy-sticker"      style="top:33%;left:30%;--rot:14deg">✨</span>
					<span class="diy-sticker"      style="top:29%;left:72%;--rot:-6deg">📖</span>
					<span class="diy-sticker"      style="top:55%;left:33%;--rot:10deg">🔥</span>
				</div>
					<span class="shelf-deco"></span>
					<div class="handle"></div>
					<div class="vent vent-bottom"></div>
				</div>
			</section>

			<!-- ============ ②号柜（门向右外开，遮住③号门） ============ -->
			<section class="bay bay-2" id="bay2">
				<!-- 柜内 -->
				<div class="inside">
					<!-- 顶层：书本 → 问答页 -->
					<button class="obj hotspot obj-books" data-action="link" data-href="quiz.html" title="紫幻小课堂">
						<svg viewBox="0 0 200 120" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
							<rect x="6" y="40" width="15" height="78" rx="2" fill="#7fa6cf"/>
							<rect x="24" y="26" width="13" height="92" rx="2" fill="#e7b78a"/>
							<rect x="40" y="46" width="15" height="72" rx="2" fill="#f0d98a"/>
							<rect x="58" y="20" width="12" height="98" rx="2" fill="#d7e6f1"/>
							<rect x="73" y="36" width="16" height="82" rx="2" fill="#e7a6a6"/>
							<rect x="92" y="28" width="13" height="90" rx="2" fill="#a9c6dc"/>
							<rect x="108" y="48" width="15" height="70" rx="2" fill="#d9c7ef"/>
							<rect x="126" y="32" width="13" height="86" rx="2" fill="#f2f2f2"/>
							<rect x="142" y="22" width="15" height="96" rx="2" fill="#b7d9c4"/>
							<rect x="160" y="42" width="13" height="76" rx="2" fill="#8fb4d9"/>
							<rect x="176" y="30" width="16" height="88" rx="2" fill="#efd2a6"/>
						</svg>
					</button>
					<div class="shelf shelf-top"></div>

					<!-- 中层：🏆奖杯 → 荣誉文件夹扇 -->
					<button class="obj hotspot obj-trophy" data-action="modal" data-target="folders-honor" title="个人荣誉">
						<svg viewBox="0 0 120 120" aria-hidden="true">
							<path d="M32 14 h56 v22 a28 28 0 0 1 -56 0 z" fill="#f2c14e"/>
							<path d="M32 20 q-16 2 -16 18 q0 12 14 12" fill="none" stroke="#e0a93b" stroke-width="7" stroke-linecap="round"/>
							<path d="M88 20 q16 2 16 18 q0 12 -14 12" fill="none" stroke="#e0a93b" stroke-width="7" stroke-linecap="round"/>
							<rect x="54" y="62" width="12" height="14" fill="#e0a93b"/>
							<rect x="38" y="76" width="44" height="10" rx="3" fill="#d69b2f"/>
							<rect x="32" y="88" width="56" height="10" rx="3" fill="#c98d27"/>
							<path d="M60 24 l5 10 11 1 -8 8 2 11 -10 -6 -10 6 2 -11 -8 -8 11 -1 z" fill="#fff6d8"/>
						</svg>
					</button>

					<!-- 小蛋糕 → 生日互动页 -->
					<button class="obj hotspot obj-cake" data-action="link" data-href="birthday.html" title="生日蛋糕">
						<svg viewBox="0 0 100 110" aria-hidden="true">
							<ellipse cx="50" cy="18" rx="5" ry="7" fill="#f6b1c8"/>
							<rect x="48" y="22" width="4" height="16" fill="#e8d9b8"/>
							<path d="M20 50 q10 -12 20 0 q10 12 20 0 q10 -12 20 0 v34 a8 8 0 0 1 -8 8 h-44 a8 8 0 0 1 -8 -8 z" fill="#f7e9ee"/>
							<path d="M20 52 q10 -10 20 0 q10 10 20 0 q10 -10 20 0" fill="none" stroke="#e9b8c8" stroke-width="4"/>
							<rect x="14" y="84" width="72" height="10" rx="4" fill="#e3cdd7"/>
							<circle cx="38" cy="68" r="3" fill="#e88fa6"/><circle cx="62" cy="70" r="3" fill="#e88fa6"/>
						</svg>
					</button>
					<div class="shelf shelf-mid"></div>

					<!-- 底层左：书包 → 文字介绍卡片扇 -->
					<button class="obj hotspot obj-bag" data-action="modal" data-target="bag" title="紫幻的书包">
							<svg viewBox="0 0 120 130" aria-hidden="true">
								<path d="M38 30 q22 -18 44 0" fill="none" stroke="#c6b8e8" stroke-width="8" stroke-linecap="round"/>
								<rect x="22" y="30" width="76" height="84" rx="18" fill="#cfc3ec"/>
								<path d="M22 62 q38 18 76 0 v36 a16 16 0 0 1 -16 16 h-44 a16 16 0 0 1 -16 -16 z" fill="#b9a9e0"/>
								<rect x="38" y="66" width="44" height="30" rx="10" fill="#e6e0f7"/>
								<circle cx="60" cy="81" r="6" fill="#b9a9e0"/>
							</svg>
						</button>

					<!-- 底层右：吉他 → 直播唱的歌 -->
					<button class="obj hotspot obj-guitar" data-action="link" data-href="songs.html" title="直播时候唱的歌">
						<svg viewBox="0 0 110 170" aria-hidden="true">
							<rect x="50" y="14" width="10" height="80" rx="3" fill="#9a7652"/>
							<rect x="44" y="4" width="22" height="18" rx="5" fill="#8a6848"/>
							<circle cx="55" cy="122" r="30" fill="#7fc6d9"/>
							<circle cx="55" cy="112" r="17" fill="#9fd8e6"/>
							<circle cx="55" cy="112" r="6" fill="#5d9fb2"/>
							<path d="M30 108 q-14 6 -8 22 M80 108 q14 6 8 22" stroke="#7fc6d9" stroke-width="8" fill="none" stroke-linecap="round"/>
							<line x1="52" y1="12" x2="52" y2="140" stroke="#5d9fb2" stroke-width="1.5"/>
							<line x1="58" y1="12" x2="58" y2="140" stroke="#5d9fb2" stroke-width="1.5"/>
						</svg>
					</button>
					<div class="shelf shelf-bottom"></div>
				</div>

				<!-- ②号门扇：正反两面。外侧是柜门正面（通风槽/贴纸/把手），内测挂证件卡和打字机 -->
				<div class="door door-swing" id="door2">
					<!-- 外侧（柜门正面） -->
					<div class="door-face door-outer">
						<div class="vent vent-top"></div>
						<span class="sticker s1"></span><span class="sticker s2"></span>
						<span class="sticker s3"></span><span class="sticker s4"></span>
						<span class="sticker s5"></span>
						<div class="handle"></div>
						<div class="vent vent-bottom"></div>
					</div>
					<!-- 内测（柜门里面，开门后朝向我们）：装饰贴纸 + 挂钩证件卡 + 打字机 -->
					<div class="door-face door-inner">
						<span class="sticker s1"></span>
						<span class="sticker s2"></span>
						<span class="sticker s3"></span>
						<span class="sticker s4"></span>
						<span class="sticker s5"></span>
						<!-- 趣味贴纸装饰（跟随门转动，静态摆放不挡证件卡/打字机） -->
						<span class="diy-sticker on-inner static-sticker st-badge" style="top:40%;right:10%;left:auto;--rot:8deg">💜</span>
						<span class="diy-sticker on-inner static-sticker" style="top:54%;left:9%;right:auto;--rot:-10deg">😴</span>
						<span class="diy-sticker on-inner static-sticker" style="top:72%;right:16%;left:auto;--rot:6deg">🐑</span>
						<!-- 挂钩证件卡 → 个人简介 -->
						<button class="obj hotspot obj-idcard" data-action="modal" data-target="idcard" title="基本信息">
							<svg viewBox="0 0 90 120" aria-hidden="true">
								<rect x="38" y="2" width="14" height="22" rx="3" fill="#e8c44f"/>
								<path d="M45 24 v10 M45 34 l-8 10 M45 34 l8 10" stroke="#8a8f98" stroke-width="4" fill="none" stroke-linecap="round"/>
								<rect x="8" y="44" width="74" height="70" rx="8" fill="#fff" stroke="#c9d8e4" stroke-width="2"/>
								<circle cx="30" cy="72" r="12" fill="#f0c9a8"/>
								<path d="M18 104 q12 -18 24 0" fill="#f0c9a8"/>
								<rect x="50" y="60" width="24" height="5" rx="2" fill="#bcd0df"/>
								<rect x="50" y="72" width="24" height="5" rx="2" fill="#d7e3ec"/>
								<rect x="50" y="84" width="24" height="5" rx="2" fill="#d7e3ec"/>
							</svg>
						</button>
						<!-- 打字机 → 软木板祝福墙 -->
						<button class="obj hotspot obj-typewriter" data-action="modal" data-target="corkboard" title="留言板">
							<svg viewBox="0 0 150 120" aria-hidden="true">
								<rect x="40" y="6" width="70" height="34" rx="4" fill="#fbf6ea" stroke="#d8c9ae" stroke-width="2"/>
								<line x1="50" y1="18" x2="100" y2="18" stroke="#cbb892" stroke-width="3"/>
								<line x1="50" y1="28" x2="90" y2="28" stroke="#dcc9a2" stroke-width="3"/>
								<path d="M20 44 h110 l10 46 a10 10 0 0 1 -10 12 h-110 a10 10 0 0 1 -10 -12 z" fill="#6b5446"/>
								<g fill="#f3ead9">
									<circle cx="42" cy="66" r="5"/><circle cx="60" cy="66" r="5"/><circle cx="78" cy="66" r="5"/><circle cx="96" cy="66" r="5"/><circle cx="114" cy="66" r="5"/>
									<circle cx="51" cy="80" r="5"/><circle cx="69" cy="80" r="5"/><circle cx="87" cy="80" r="5"/><circle cx="105" cy="80" r="5"/>
								</g>
								<rect x="60" y="92" width="30" height="8" rx="4" fill="#4d3c32"/>
							</svg>
						</button>
					</div>
				</div>
			</section>

			<!-- ============ ③号门（关闭，被②号门扇遮住，纯结构） ============ -->
			<section class="bay bay-3">
				<div class="door door-closed plain">
					<div class="vent vent-top"></div>
					<div class="handle"></div>
					<div class="vent vent-bottom"></div>
				</div>
			</section>

			<!-- ============ ④号门（关闭）：地图 + 合照 ============ -->
			<section class="bay bay-4">
				<div class="door door-closed">
					<div class="vent vent-top"></div>
					<!-- 小地图贴纸 → 足迹地图 -->
					<button class="obj hotspot sticker-map" data-action="link" data-href="map.html" title="决赛地图">
						<svg viewBox="0 0 130 100" aria-hidden="true">
							<path d="M10 16 l34 -10 42 10 34 -10 v78 l-34 10 -42 -10 -34 10 z" fill="#f0e6d2" stroke="#d9c9a6" stroke-width="2"/>
							<path d="M44 6 v78 M86 16 v78" stroke="#ddcba6" stroke-width="2"/>
							<path d="M24 66 q22 -30 44 -6 q18 18 42 -14" fill="none" stroke="#d98a7a" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
							<circle cx="24" cy="66" r="5" fill="#e8803f"/>
							<circle cx="68" cy="60" r="5" fill="#e8803f"/>
							<circle cx="110" cy="46" r="5" fill="#e8803f"/>
						</svg>
					</button>
					<!-- 照片 + DIY 贴纸墙（可在①④号门之间互相拖动） -->
					<div class="photo-wall" data-door="4">
						<button class="pw pw-5 obj hotspot" data-action="lightbox" data-img="assets/images/489b560dac47556b52a4873c109d7414.jpg" title="点击查看大图"><img src="assets/images/489b560dac47556b52a4873c109d7414.jpg" alt="合照"></button>
						<button class="pw pw-6 obj hotspot" data-action="lightbox" data-img="assets/images/af5d3cdd12c2d1cefb051bfc4ff9e732.jpg" title="点击查看大图"><img src="assets/images/af5d3cdd12c2d1cefb051bfc4ff9e732.jpg" alt="合照"></button>
						<button class="pw pw-7 obj hotspot" data-action="lightbox" data-img="assets/images/cd6bc17bc30cd3fb0e9cb349dc3e5903.jpg" title="点击查看大图"><img src="assets/images/cd6bc17bc30cd3fb0e9cb349dc3e5903.jpg" alt="合照"></button>
						<!-- DIY 趣味小贴纸（去重后 5 枚） -->
						<span class="diy-sticker"      style="top:11%;left:10%;--rot:-10deg">🎤</span>
						<span class="diy-sticker"      style="top:12%;left:40%;--rot:10deg">🎂</span>
						<span class="diy-sticker"      style="top:42%;left:40%;--rot:-14deg">⭐</span>
						<span class="diy-sticker st-lg" style="top:72%;left:36%;--rot:9deg">🎸</span>
						<span class="diy-sticker st-badge" style="top:78%;left:8%;--rot:-6deg">🏆</span>
					</div>
					<span class="sticker-dot"></span>
					<div class="handle"></div>
					<div class="vent vent-bottom"></div>
				</div>
			</section>

		</div>
		<div class="floor-shadow"></div>
	</div>
</main>

<!-- 弹层根节点（内容由 main.js 依据 data.js 渲染） -->
<div class="modal-root" id="modalRoot" hidden></div>

<!-- BGM 开关（data.js 填了音频才显示） -->
<button class="bgm-btn" id="bgmBtn" hidden>♪ <span id="bgmLabel">BGM</span></button>

<!-- 提示：按 H 可显示/隐藏热区调试框（后期标定素材热区用） -->
<script src="js/data.js?v=9"></script>
<script src="js/main.js?v=12"></script>
</body>
</html>
